name: Infra

# Bicep validation. Path-filtered so the rest of the repo doesn't pay for it.
# Catches syntax + parameter type issues before they hit `az deployment group create`.

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job here: nothing in this workflow writes to the
# repository, so a compromised action or dependency gets a token that can only
# read. Widen per job if one ever genuinely needs more.
permissions:
  contents: read

jobs:
  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bicep CLI
        run: az bicep install

      - name: Bicep version
        run: az bicep version

      - name: Bicep build (main.bicep)
        run: az bicep build --file infra/main.bicep --outfile $RUNNER_TEMP/main.json

      - name: Show generated ARM size
        run: |
          wc -c "$RUNNER_TEMP/main.json"
