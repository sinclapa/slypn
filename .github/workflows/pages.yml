name: Pages

# Publishes the presentation deck in presentation/ to GitHub Pages.
#
# Deliberately independent of every other workflow in this repo. The production
# SWA deploy hangs off CI via workflow_run, so this one neither triggers on nor
# gates that chain — a deck change must never be able to affect the site.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions. Without it the
# deploy step fails with "Pages site not found".

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to publish and id-token:write for the
# deployment's OIDC verification.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished publish — an interrupted deploy can leave the
# Pages site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish deck
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Only presentation/ is uploaded, so index.html lands at the site root.
      - name: Upload deck
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: presentation

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
