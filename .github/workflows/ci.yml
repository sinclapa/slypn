name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job here: nothing in this workflow writes to the
# repository, so a compromised action or dependency gets a token that can only
# read. Widen per job if one ever genuinely needs more.
permissions:
  contents: read

jobs:
  web:
    name: Web (Vue + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci --no-fund --no-audit --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:unit:coverage

      - name: Build (includes typecheck via vue-tsc)
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage
          path: src/web/coverage
          retention-days: 1

  api:
    name: API (.NET Functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (API)
        run: dotnet restore src/api/Slypn.Api/Slypn.Api.csproj

      - name: Build (API)
        run: dotnet build src/api/Slypn.Api/Slypn.Api.csproj --no-restore --configuration Release

      - name: Build (Seed CLI)
        run: dotnet build src/api/Slypn.Seed/Slypn.Seed.csproj --configuration Release

      - name: Test (API) with coverage
        run: >
          dotnet test src/api/Slypn.Api.Tests/Slypn.Api.Tests.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings src/api/Slypn.Api.Tests/coverlet.runsettings
          --results-directory src/api/Slypn.Api.Tests/TestResults
          --verbosity normal

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage
          path: src/api/Slypn.Api.Tests/TestResults
          retention-days: 1

  e2e:
    name: E2E (Playwright + live API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      # Same key as the `api` job so the two share one cache entry.
      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # --ignore-scripts as everywhere else: azurite declares no install/postinstall
      # hook (only `prepare`, which does not run for consumers), so nothing here
      # needs package lifecycle scripts.
      - name: Install web dependencies
        working-directory: src/web
        run: npm ci --no-fund --no-audit --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('src/web/package-lock.json') }}

      # The locally installed binary, not npx: npx is allowed to resolve and run
      # a package on demand, so it is not a deterministic install step.
      - name: Install Chromium
        working-directory: src/web
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # Pinned release + published SHA-256 rather than `npm i -g ...@4`, which
      # floats within the major version and relies on a postinstall script to
      # fetch the actual binaries.
      - name: Install Azure Functions Core Tools
        env:
          FUNC_VERSION: '4.13.0'
        run: |
          base="https://github.com/Azure/azure-functions-core-tools/releases/download/${FUNC_VERSION}"
          # --proto/--proto-redir pin the whole chain to HTTPS: -L follows
          # redirects, and curl would otherwise happily follow one to http://.
          curl_opts=(-sSLf --proto '=https' --proto-redir '=https')
          curl "${curl_opts[@]}" -o func.zip      "${base}/Azure.Functions.Cli.linux-x64.${FUNC_VERSION}.zip"
          curl "${curl_opts[@]}" -o func.zip.sha2 "${base}/Azure.Functions.Cli.linux-x64.${FUNC_VERSION}.zip.sha2"
          echo "$(cat func.zip.sha2)  func.zip" | sha256sum -c -
          unzip -q func.zip -d "$HOME/.func"
          chmod +x "$HOME/.func/func"
          rm -f func.zip func.zip.sha2
          echo "$HOME/.func" >> "$GITHUB_PATH"
          "$HOME/.func/func" --version

      # e2e/global-setup.ts starts Azurite and `dotnet run -c Release`, which
      # builds the project itself and launches the host via Core Tools.
      # Restoring here just warms the NuGet cache so that build stays inside
      # the health-check budget.
      - name: Restore API + seed CLI
        run: |
          dotnet restore src/api/Slypn.Api/Slypn.Api.csproj
          dotnet restore src/api/Slypn.Seed/Slypn.Seed.csproj

      - name: Create local.settings.json
        run: cp src/api/Slypn.Api/local.settings.sample.json src/api/Slypn.Api/local.settings.json

      - name: Run e2e suite
        working-directory: src/web
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/.testresults/e2e-backend
        run: npm run test:e2e

      # Traces, videos and screenshots for the failing tests, plus the func and
      # azurite logs — a CI-only failure is near-undiagnosable without them.
      # Backend logs go up even on success. They are small, and they are the
      # only evidence of HOW the API ran — which configuration it built, which
      # functions it indexed. Without them a green run cannot be distinguished
      # from a green run that quietly did the wrong thing.
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-backend-logs
          path: .testresults/e2e-backend
          retention-days: 7

      # Traces, videos and screenshots are large, so only when something failed.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: |
            src/web/playwright-report
            src/web/test-results
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [web, api]
    # Dependabot PRs run against Dependabot's own secret store, so secrets.SONAR_TOKEN
    # arrives empty and the scan dies on "Not authorized or project not found". Mirroring
    # the token over there would let a bot-authored PR spend our Sonar credentials, and it
    # would buy nothing: Dependabot is configured for github-actions only, so its PRs change
    # workflow YAML and no analysed source. Skip instead — a skipped job still satisfies a
    # required check, and web/api/e2e need no secrets, so the bumped SHAs are still tested.
    #
    # Keyed on the PR author rather than github.actor: the actor is whoever triggered the run,
    # which is forgeable as a trust signal (sonar githubactions:S8232) and would also match a
    # human merging a Dependabot PR. On a push there is no pull_request payload, so this is
    # null and main stays analysed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Set up JDK 17 (required by SonarScanner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      # Sonar's JS/TS analyzer wants node_modules present to resolve types, but
      # the test suite itself already ran in the "web" job — reuse its coverage
      # instead of reinstalling+retesting here.
      - name: Install web dependencies
        working-directory: src/web
        run: npm ci --no-fund --no-audit --ignore-scripts

      - name: Download web coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-coverage
          path: src/web/coverage

      - name: Download API coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-coverage
          path: src/api/Slypn.Api.Tests/TestResults

      # sonar.coverage.exclusions mirrors coverlet.runsettings' <ExcludeByFile> —
      # coverlet excludes these files from local/CI instrumentation (Azure Storage
      # wrappers etc. that need live infra, covered separately by e2e), but that
      # exclusion doesn't tell Sonar's quality gate to stop requiring coverage for
      # them. Keep the two lists in sync.
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet-sonarscanner begin
          /k:"sinclapa_slypn"
          /o:"cookingcode"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.cobertura.reportsPaths="src/api/Slypn.Api.Tests/TestResults/**/coverage.cobertura.xml"
          /d:sonar.javascript.lcov.reportPaths="src/web/coverage/lcov.info"
          /d:sonar.typescript.lcov.reportPaths="src/web/coverage/lcov.info"
          /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/coverage/**,**/playwright-report/**,**/test-results/**,**/bin/**,**/obj/**"
          /d:sonar.test.inclusions="src/web/src/**/*.spec.ts,src/web/src/**/*.test.ts,src/web/e2e/**"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Infrastructure/OpenApiConfig.cs,**/Infrastructure/OtelSources.cs,**/Infrastructure/SwaggerUiOptions.cs,**/Infrastructure/TracingMiddleware.cs,**/Infrastructure/JwtMiddleware.cs,**/Infrastructure/TableBootstrapper.cs,**/Infrastructure/EntraJwtValidator.cs,**/Services/ContentRepository.cs,**/Services/BlobService.cs,**/Services/ContentBodyStore.cs,**/Services/TableStore.cs,**/Services/EntraUserService.cs,**/Services/CiamInviteService.cs"
          /d:sonar.qualitygate.wait=true

      # dotnet build must run between begin/end (not just once in the "api" job)
      # for SonarScanner's Roslyn instrumentation to capture the C# analysis —
      # the test run itself is not repeated, its coverage is downloaded above.
      - name: Restore (API)
        run: dotnet restore src/api/Slypn.Api/Slypn.Api.csproj

      - name: Build (API)
        run: dotnet build src/api/Slypn.Api/Slypn.Api.csproj --no-restore --configuration Release

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end
