name: Azure Static Web Apps deploy

# Production deploys on push to main; PR previews on every open / update.
# SWA closes the preview environment when the PR is closed.
#
# Required repo secrets (set via .\infra\setup.ps1):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — SWA deployment token
#   CIAM_TENANT_ID     — Entra External ID tenant ID
#   CIAM_CLIENT_ID     — slypn-ci app client ID (Application.ReadWrite.OwnedBy on Graph)
#   CIAM_CLIENT_SECRET — slypn-ci client secret
#   SPA_OBJECT_ID      — slypn-web app object ID

on:
  push:
    branches: [main]
  # Nightly safety net for the orphan reaper, so a quiet period on main cannot
  # let dead preview environments sit on the Free-tier cap.
  schedule:
    - cron: '17 4 * * *'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  # Include the event name so that a push to main and a pull_request event
  # (which share github.ref = refs/heads/main for push, or refs/pull/<N>/merge
  # for every pull_request action) get separate slots and don't cancel each
  # other. Also split "closed" into its own slot: opened/synchronize/reopened
  # all share the same ref as closed, so without this a close_pr_environment
  # run could be — and was — cancelled by a build_and_deploy run for the same
  # PR, leaving the preview environment never torn down. Multiple pushes to
  # the same branch/PR still cancel the earlier in-progress run as intended.
  group: swa-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action == 'closed' && 'close' || 'build' }}
  # Builds still supersede each other, but a teardown must never be cancelled:
  # PR #166's close run was cancelled mid-flight and its preview environment
  # then sat there consuming a Free-tier slot until it was deleted by hand.
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build + deploy
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Ahead of a planned move to the Free plan (which caps concurrent
      # preview environments at 3; production's "default" environment doesn't
      # count), guard the quota now while still on Standard so this is proven
      # out before the cap can actually bite. Fail fast — in seconds, before
      # the Node/dotnet/build steps — rather than letting a brand-new PR's
      # deploy fail deep inside the SWA deploy action with a cryptic Azure
      # error once the cap is hit.
      - name: Guard preview-environment quota (Free tier cap = 3)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          FREE_TIER_CAP=3

          PREVIEW_JSON=$(az staticwebapp environment list \
            --name swa-slypn-prod --resource-group rg-slypn-prod \
            --query "[?name!='default'].name" -o json)

          EXISTING_COUNT=$(echo "$PREVIEW_JSON" | jq 'length')
          ALREADY_OPEN=$(echo "$PREVIEW_JSON" | jq --arg pr "$PR_NUMBER" 'any(. == $pr)')

          if [ "$ALREADY_OPEN" = "true" ]; then
            echo "PR #$PR_NUMBER already has a preview environment ($EXISTING_COUNT/$FREE_TIER_CAP in use) — proceeding."
            exit 0
          fi

          if [ "$EXISTING_COUNT" -ge "$FREE_TIER_CAP" ]; then
            echo "::error::Cannot open a new preview environment for PR #$PR_NUMBER — $EXISTING_COUNT/$FREE_TIER_CAP preview environments already in use. Close or merge an open PR to free a slot, then push a new commit to re-trigger."
            exit 1
          fi

          echo "$EXISTING_COUNT/$FREE_TIER_CAP preview environments in use — room for a new one."
        shell: bash

      # Entra takes a few minutes to propagate a new SPA redirect URI to the token
      # endpoint. Registering only after the deploy meant the preview link was live —
      # and already posted to the PR — before sign-in worked, so anyone clicking
      # straight away got AADSTS9002326 ("cross-origin token redemption is permitted
      # only for the Single-Page Application client-type"): /authorize knew the URI,
      # the token endpoint did not yet know it was an SPA one.
      #
      # The preview hostname is derivable from production's, so claim it up front and
      # let the build and deploy absorb the propagation delay. The post-deploy step
      # below still runs and is authoritative.
      - name: Pre-register PR preview redirect URI
        if: github.event_name == 'pull_request'
        env:
          CIAM_TENANT_ID:     ${{ secrets.CIAM_TENANT_ID }}
          CIAM_CLIENT_ID:     ${{ secrets.CIAM_CLIENT_ID }}
          CIAM_CLIENT_SECRET: ${{ secrets.CIAM_CLIENT_SECRET }}
          SPA_OBJECT_ID:      ${{ secrets.SPA_OBJECT_ID }}
        run: .github/scripts/spa-redirect-uri.sh add "${{ github.event.pull_request.number }}"
        shell: bash

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./src/web/package.json').version")
          SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=$BASE" >> $GITHUB_OUTPUT
          else
            echo "value=${BASE}-pr.${{ github.event.pull_request.number }}+${SHA}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Write API appsettings
        env:
          OTEL_ENV:      ${{ github.event_name == 'push' && 'prod' || 'dev' }}
          SPA_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
        run: |
          printf '{\n  "Otel": { "Env": "%s" },\n  "Swagger": { "SpaClientId": "%s" }\n}\n' \
            "$OTEL_ENV" "$SPA_CLIENT_ID" > src/api/Slypn.Api/appsettings.json
        shell: bash

      - name: Build + deploy to SWA
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/web
          api_location: src/api/Slypn.Api
          output_location: dist
        env:
          # Vite bakes these into the JS bundle at build time.
          # Set via: .\infra\setup.ps1 (GitHub secrets phase).
          VITE_MSAL_AUTHORITY: ${{ secrets.VITE_MSAL_AUTHORITY }}
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_API_SCOPE:      ${{ secrets.VITE_API_SCOPE }}
          # Faro frontend observability — URL stored as secret (client-side but kept out of source).
          # VITE_FARO_ENV: push to main → prod, PR preview builds → dev.
          VITE_FARO_URL:             ${{ secrets.VITE_FARO_URL }}
          VITE_FARO_ENV:             ${{ github.event_name == 'push' && 'prod' || 'dev' }}
          # Faro source map uploads — build-time only, never exposed to the browser.
          # Find these values in Grafana Cloud → Frontend Observability → Settings → Source Maps.
          FARO_SOURCEMAP_ENDPOINT:   ${{ secrets.FARO_SOURCEMAP_ENDPOINT }}
          FARO_SOURCEMAP_APP_ID:     ${{ secrets.FARO_SOURCEMAP_APP_ID }}
          FARO_SOURCEMAP_STACK_ID:   ${{ secrets.FARO_SOURCEMAP_STACK_ID }}
          FARO_SOURCEMAP_API_KEY:    ${{ secrets.FARO_SOURCEMAP_API_KEY }}
          VITE_APP_VERSION:          ${{ steps.version.outputs.value }}

      - name: Set Otel__Env=prod on production
        if: github.event_name == 'push'
        run: |
          az staticwebapp appsettings set \
            --name swa-slypn-prod --resource-group rg-slypn-prod \
            --setting-names Otel__Env=prod APP_VERSION=${{ steps.version.outputs.value }}
        shell: bash

      - name: Set Otel__Env=dev on PR preview
        if: github.event_name == 'pull_request'
        run: |
          ENV_NAME="${{ github.event.pull_request.number }}"
          # SWA preview environments appear in ARM a few seconds after the deploy
          # action completes. Retry for up to 2 minutes before failing.
          for i in $(seq 1 8); do
            az staticwebapp appsettings set \
              --name swa-slypn-prod --resource-group rg-slypn-prod \
              --environment-name "$ENV_NAME" \
              --setting-names Otel__Env=dev APP_VERSION=${{ steps.version.outputs.value }} && break
            echo "Preview environment not yet ARM-visible (attempt $i/8) — retrying in 15s..."
            sleep 15
          done
        shell: bash

      - name: Register PR preview redirect URI
        if: github.event_name == 'pull_request'
        env:
          CIAM_TENANT_ID:     ${{ secrets.CIAM_TENANT_ID }}
          CIAM_CLIENT_ID:     ${{ secrets.CIAM_CLIENT_ID }}
          CIAM_CLIENT_SECRET: ${{ secrets.CIAM_CLIENT_SECRET }}
          SPA_OBJECT_ID:      ${{ secrets.SPA_OBJECT_ID }}
        # Authoritative: uses the URL the deploy actually produced. Normally a no-op,
        # because the pre-register step above derived the same host — but it corrects
        # the derivation if Azure's preview naming ever changes.
        run: .github/scripts/spa-redirect-uri.sh add "${{ steps.builddeploy.outputs.static_web_app_url }}"
        shell: bash

  close_pr_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR environment
    permissions:
      contents: read
      id-token: write
    steps:
      # This job did not check out before — it does now because the redirect-URI
      # cleanup below runs a script from the repo.
      #
      # The base branch, not the default refs/pull/N/merge: that ref can be gone by
      # the time a closed PR is processed, and the cleanup script only ever needs the
      # version already on main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          submodules: false
          lfs: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove PR preview redirect URI
        env:
          CIAM_TENANT_ID:     ${{ secrets.CIAM_TENANT_ID }}
          CIAM_CLIENT_ID:     ${{ secrets.CIAM_CLIENT_ID }}
          CIAM_CLIENT_SECRET: ${{ secrets.CIAM_CLIENT_SECRET }}
          SPA_OBJECT_ID:      ${{ secrets.SPA_OBJECT_ID }}
        # By PR number, not by querying the environment's hostname: that query returned
        # empty once the environment had already gone, which silently removed nothing
        # and leaked the redirect URI permanently.
        run: .github/scripts/spa-redirect-uri.sh remove "${{ github.event.pull_request.number }}"
        shell: bash

      - name: Close PR environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

      # The close action reports success without checking that anything was
      # actually removed, and it loses a race it cannot see: for PR #162 it ran
      # at 23:12:57, found no environment, exited green — and an in-flight
      # preview deploy created environment 162 ten seconds later, where it sat
      # in a Failed state consuming a slot. Deliberately splitting close into
      # its own concurrency group (so it cannot cancel a build) is what allows
      # a build to outlive it, so watch for a late arrival rather than assuming
      # the close won. Deleting is idempotent, so a slow first appearance and a
      # close that genuinely worked both end in the same state.
      - name: Verify the preview environment is really gone
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          env_present() {
            local count
            count=$(az staticwebapp environment list               --name swa-slypn-prod --resource-group rg-slypn-prod               --query "[?name=='$PR_NUMBER'] | length(@)" -o tsv)
            [ "$count" != "0" ]
          }

          absent_streak=0
          for attempt in $(seq 1 10); do
            if env_present; then
              echo "attempt $attempt/10: environment $PR_NUMBER present — deleting."
              az staticwebapp environment delete                 --name swa-slypn-prod --resource-group rg-slypn-prod                 --environment-name "$PR_NUMBER" --yes
              absent_streak=0
            else
              absent_streak=$((absent_streak + 1))
              echo "attempt $attempt/10: no environment for PR #$PR_NUMBER (absent x$absent_streak)."
              # Gone for three consecutive checks (~30s). A deploy still in
              # flight when the PR closed would have surfaced by now, so stop
              # rather than burn the full window on every well-behaved close.
              if [ "$absent_streak" -ge 3 ]; then break; fi
            fi
            sleep 15
          done

          if env_present; then
            echo "::error::Environment $PR_NUMBER survived every delete attempt — free the slot by hand."
            exit 1
          fi
          echo "PR #$PR_NUMBER has no preview environment."

  # Backstop for anything the per-PR teardown misses: a cancelled close run, a
  # deploy that outlived it, a PR closed while Actions was down. Reconciles the
  # whole list against the open PRs rather than trusting any single event, so
  # the Free-tier cap cannot silently fill up again the way it did with 162 and
  # 166 — both orphaned by closed PRs and only noticed when a new PR was blocked.
  reap_orphan_previews:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: Reap orphaned preview environments
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete preview environments with no open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # "default" is production and is never a preview environment.
          ENVS=$(az staticwebapp environment list             --name swa-slypn-prod --resource-group rg-slypn-prod             --query "[?name!='default'].name" -o tsv)

          if [ -z "$ENVS" ]; then
            echo "No preview environments exist."
            exit 0
          fi

          OPEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open             --limit 200 --json number --jq '.[].number')
          echo "Open PRs: ${OPEN_PRS:-none}"

          REAPED=0
          for env in $ENVS; do
            # Only ever touch environments named after a PR number; anything
            # else was created by hand and is not ours to delete.
            if ! echo "$env" | grep -qE '^[0-9]+$'; then
              echo "Skipping non-PR environment '$env'."
              continue
            fi
            if echo "$OPEN_PRS" | grep -qx "$env"; then
              echo "Keeping $env — PR #$env is still open."
              continue
            fi
            echo "Reaping $env — PR #$env is not open."
            az staticwebapp environment delete               --name swa-slypn-prod --resource-group rg-slypn-prod               --environment-name "$env" --yes
            REAPED=$((REAPED + 1))
          done

          echo "Reaped $REAPED orphaned preview environment(s)."
