name: Azure Static Web Apps deploy

# Production deploys on push to main; PR previews on every open / update.
# SWA closes the preview environment when the PR is closed.
#
# Required repo secret (set after first Bicep deploy):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — the deployment token from the SWA
#     resource (Azure portal -> swa-slypn-* -> Manage deployment token,
#     or `az staticwebapp secrets list -n swa-slypn-prod -g rg-slypn-prod`).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  # Include the event name so that a push to main and a pull_request-closed
  # event (which share github.ref = refs/heads/main) get separate slots and
  # don't cancel each other. Multiple pushes to the same branch still cancel
  # the earlier in-progress run as intended.
  group: swa-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build + deploy
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build + deploy to SWA
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/web
          api_location: src/api/Slypn.Api
          output_location: dist
        env:
          # Vite bakes these into the JS bundle at build time.
          # Set via: .\infra\setup.ps1 (GitHub secrets phase).
          VITE_MSAL_AUTHORITY: ${{ secrets.VITE_MSAL_AUTHORITY }}
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_API_SCOPE:      ${{ secrets.VITE_API_SCOPE }}
          # Faro frontend observability — URL stored as secret (client-side but kept out of source).
          # VITE_FARO_ENV: push to main → prod, PR preview builds → dev.
          VITE_FARO_URL:             ${{ secrets.VITE_FARO_URL }}
          VITE_FARO_ENV:             ${{ github.event_name == 'push' && 'prod' || 'dev' }}
          # Faro source map uploads — build-time only, never exposed to the browser.
          # Find these values in Grafana Cloud → Frontend Observability → Settings → Source Maps.
          FARO_SOURCEMAP_ENDPOINT:   ${{ secrets.FARO_SOURCEMAP_ENDPOINT }}
          FARO_SOURCEMAP_APP_ID:     ${{ secrets.FARO_SOURCEMAP_APP_ID }}
          FARO_SOURCEMAP_STACK_ID:   ${{ secrets.FARO_SOURCEMAP_STACK_ID }}
          FARO_SOURCEMAP_API_KEY:    ${{ secrets.FARO_SOURCEMAP_API_KEY }}

      - name: Set API OTel settings on PR preview
        if: github.event_name == 'pull_request'
        run: |
          az staticwebapp appsettings set \
            --name swa-slypn-prod \
            --resource-group rg-slypn-prod \
            --environment-name "pr-${{ github.event.pull_request.number }}" \
            --setting-names \
              "Otel__Endpoint=${{ secrets.OTEL_ENDPOINT }}" \
              "Otel__Headers=${{ secrets.OTEL_HEADERS }}" \
              "Otel__ServiceName=slypn-api" \
              "Otel__Env=dev"
        shell: bash

  close_pr_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR environment
    steps:
      - name: Close PR environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
