name: Azure Static Web Apps deploy

# Production deploys on push to main; PR previews on every open / update.
# SWA closes the preview environment when the PR is closed.
#
# Required repo secrets (set via .\infra\setup.ps1):
#   AZURE_STATIC_WEB_APPS_API_TOKEN — SWA deployment token
#   CIAM_TENANT_ID     — Entra External ID tenant ID
#   CIAM_CLIENT_ID     — slypn-ci app client ID (Application.ReadWrite.OwnedBy on Graph)
#   CIAM_CLIENT_SECRET — slypn-ci client secret
#   SPA_OBJECT_ID      — slypn-web app object ID

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  # Include the event name so that a push to main and a pull_request event
  # (which share github.ref = refs/heads/main for push, or refs/pull/<N>/merge
  # for every pull_request action) get separate slots and don't cancel each
  # other. Also split "closed" into its own slot: opened/synchronize/reopened
  # all share the same ref as closed, so without this a close_pr_environment
  # run could be — and was — cancelled by a build_and_deploy run for the same
  # PR, leaving the preview environment never torn down. Multiple pushes to
  # the same branch/PR still cancel the earlier in-progress run as intended.
  group: swa-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action == 'closed' && 'close' || 'build' }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build + deploy
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Ahead of a planned move to the Free plan (which caps concurrent
      # preview environments at 3; production's "default" environment doesn't
      # count), guard the quota now while still on Standard so this is proven
      # out before the cap can actually bite. Fail fast — in seconds, before
      # the Node/dotnet/build steps — rather than letting a brand-new PR's
      # deploy fail deep inside the SWA deploy action with a cryptic Azure
      # error once the cap is hit.
      - name: Guard preview-environment quota (Free tier cap = 3)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          FREE_TIER_CAP=3

          PREVIEW_JSON=$(az staticwebapp environment list \
            --name swa-slypn-prod --resource-group rg-slypn-prod \
            --query "[?name!='default'].name" -o json)

          EXISTING_COUNT=$(echo "$PREVIEW_JSON" | jq 'length')
          ALREADY_OPEN=$(echo "$PREVIEW_JSON" | jq --arg pr "$PR_NUMBER" 'any(. == $pr)')

          if [ "$ALREADY_OPEN" = "true" ]; then
            echo "PR #$PR_NUMBER already has a preview environment ($EXISTING_COUNT/$FREE_TIER_CAP in use) — proceeding."
            exit 0
          fi

          if [ "$EXISTING_COUNT" -ge "$FREE_TIER_CAP" ]; then
            echo "::error::Cannot open a new preview environment for PR #$PR_NUMBER — $EXISTING_COUNT/$FREE_TIER_CAP preview environments already in use. Close or merge an open PR to free a slot, then push a new commit to re-trigger."
            exit 1
          fi

          echo "$EXISTING_COUNT/$FREE_TIER_CAP preview environments in use — room for a new one."
        shell: bash

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./src/web/package.json').version")
          SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=$BASE" >> $GITHUB_OUTPUT
          else
            echo "value=${BASE}-pr.${{ github.event.pull_request.number }}+${SHA}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Write API appsettings
        env:
          OTEL_ENV:      ${{ github.event_name == 'push' && 'prod' || 'dev' }}
          SPA_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
        run: |
          printf '{\n  "Otel": { "Env": "%s" },\n  "Swagger": { "SpaClientId": "%s" }\n}\n' \
            "$OTEL_ENV" "$SPA_CLIENT_ID" > src/api/Slypn.Api/appsettings.json
        shell: bash

      - name: Build + deploy to SWA
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/web
          api_location: src/api/Slypn.Api
          output_location: dist
        env:
          # Vite bakes these into the JS bundle at build time.
          # Set via: .\infra\setup.ps1 (GitHub secrets phase).
          VITE_MSAL_AUTHORITY: ${{ secrets.VITE_MSAL_AUTHORITY }}
          VITE_MSAL_CLIENT_ID: ${{ secrets.VITE_MSAL_CLIENT_ID }}
          VITE_API_SCOPE:      ${{ secrets.VITE_API_SCOPE }}
          # Faro frontend observability — URL stored as secret (client-side but kept out of source).
          # VITE_FARO_ENV: push to main → prod, PR preview builds → dev.
          VITE_FARO_URL:             ${{ secrets.VITE_FARO_URL }}
          VITE_FARO_ENV:             ${{ github.event_name == 'push' && 'prod' || 'dev' }}
          # Faro source map uploads — build-time only, never exposed to the browser.
          # Find these values in Grafana Cloud → Frontend Observability → Settings → Source Maps.
          FARO_SOURCEMAP_ENDPOINT:   ${{ secrets.FARO_SOURCEMAP_ENDPOINT }}
          FARO_SOURCEMAP_APP_ID:     ${{ secrets.FARO_SOURCEMAP_APP_ID }}
          FARO_SOURCEMAP_STACK_ID:   ${{ secrets.FARO_SOURCEMAP_STACK_ID }}
          FARO_SOURCEMAP_API_KEY:    ${{ secrets.FARO_SOURCEMAP_API_KEY }}
          VITE_APP_VERSION:          ${{ steps.version.outputs.value }}

      - name: Set Otel__Env=prod on production
        if: github.event_name == 'push'
        run: |
          az staticwebapp appsettings set \
            --name swa-slypn-prod --resource-group rg-slypn-prod \
            --setting-names Otel__Env=prod APP_VERSION=${{ steps.version.outputs.value }}
        shell: bash

      - name: Set Otel__Env=dev on PR preview
        if: github.event_name == 'pull_request'
        run: |
          ENV_NAME="${{ github.event.pull_request.number }}"
          # SWA preview environments appear in ARM a few seconds after the deploy
          # action completes. Retry for up to 2 minutes before failing.
          for i in $(seq 1 8); do
            az staticwebapp appsettings set \
              --name swa-slypn-prod --resource-group rg-slypn-prod \
              --environment-name "$ENV_NAME" \
              --setting-names Otel__Env=dev APP_VERSION=${{ steps.version.outputs.value }} && break
            echo "Preview environment not yet ARM-visible (attempt $i/8) — retrying in 15s..."
            sleep 15
          done
        shell: bash

      - name: Register PR preview redirect URI
        if: github.event_name == 'pull_request'
        env:
          CIAM_TENANT_ID:     ${{ secrets.CIAM_TENANT_ID }}
          CIAM_CLIENT_ID:     ${{ secrets.CIAM_CLIENT_ID }}
          CIAM_CLIENT_SECRET: ${{ secrets.CIAM_CLIENT_SECRET }}
          SPA_OBJECT_ID:      ${{ secrets.SPA_OBJECT_ID }}
          SWA_URL:            ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          CALLBACK="${SWA_URL%/}/auth/callback"
          TOKEN=$(curl -sf \
            "https://login.microsoftonline.com/${CIAM_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${CIAM_CLIENT_ID}" \
            --data-urlencode "client_secret=${CIAM_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            | jq -r .access_token)
          CURRENT=$(curl -sf \
            "https://graph.microsoft.com/v1.0/applications/${SPA_OBJECT_ID}" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -c '.spa.redirectUris')
          OAUTH_REDIRECT="${SWA_URL%/}/oauth2-redirect.html"
          UPDATED=$(echo "$CURRENT" | jq -c --arg a "$CALLBACK" --arg b "$OAUTH_REDIRECT" '. + [$a,$b] | unique')
          curl -sf -X PATCH \
            "https://graph.microsoft.com/v1.0/applications/${SPA_OBJECT_ID}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"spa\":{\"redirectUris\":${UPDATED}}}"
          echo "Registered: $CALLBACK  $OAUTH_REDIRECT"
        shell: bash

  close_pr_environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR environment
    permissions:
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove PR preview redirect URI
        env:
          CIAM_TENANT_ID:     ${{ secrets.CIAM_TENANT_ID }}
          CIAM_CLIENT_ID:     ${{ secrets.CIAM_CLIENT_ID }}
          CIAM_CLIENT_SECRET: ${{ secrets.CIAM_CLIENT_SECRET }}
          SPA_OBJECT_ID:      ${{ secrets.SPA_OBJECT_ID }}
        run: |
          set -euo pipefail
          PR_HOST=$(az staticwebapp environment list \
            --name swa-slypn-prod --resource-group rg-slypn-prod \
            --query "[?contains(hostname, '-${{ github.event.pull_request.number }}.')]|[0].hostname" \
            -o tsv)
          CALLBACK="https://${PR_HOST}/auth/callback"
          OAUTH_REDIRECT="https://${PR_HOST}/oauth2-redirect.html"
          TOKEN=$(curl -sf \
            "https://login.microsoftonline.com/${CIAM_TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${CIAM_CLIENT_ID}" \
            --data-urlencode "client_secret=${CIAM_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            | jq -r .access_token)
          CURRENT=$(curl -sf \
            "https://graph.microsoft.com/v1.0/applications/${SPA_OBJECT_ID}" \
            -H "Authorization: Bearer $TOKEN" \
            | jq -c '.spa.redirectUris')
          UPDATED=$(echo "$CURRENT" | jq -c --arg a "$CALLBACK" --arg b "$OAUTH_REDIRECT" '[.[] | select(. != $a and . != $b)]')
          curl -sf -X PATCH \
            "https://graph.microsoft.com/v1.0/applications/${SPA_OBJECT_ID}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"spa\":{\"redirectUris\":${UPDATED}}}"
          echo "Removed: $CALLBACK"
        shell: bash

      - name: Close PR environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
